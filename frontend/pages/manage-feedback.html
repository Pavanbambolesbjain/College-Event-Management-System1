<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Management - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <i class="bi bi-rocket-takeoff-fill text-gradient me-2"></i>Campus<span class="text-gradient">Connect</span>
      </a>
    </div>
  </nav>

  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-link">
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>
        <a href="/admin/manage-events" class="sidebar-link">
          <i class="bi bi-calendar-event-fill"></i> <span>Manage Events</span>
        </a>
        <a href="/admin/manage-students" class="sidebar-link">
          <i class="bi bi-people-fill"></i> <span>Manage Students</span>
        </a>
        <a href="/admin/manage-registrations" class="sidebar-link">
          <i class="bi bi-ticket-perforated-fill"></i> <span>Registrations</span>
        </a>
        <a href="/admin/analytics" class="sidebar-link">
          <i class="bi bi-graph-up-arrow"></i> <span>Event Analytics</span>
        </a>
        <a href="/admin/manage-feedback" class="sidebar-link active">
          <i class="bi bi-chat-left-text-fill"></i> <span>Feedback Mgmt</span>
        </a>
      </div>
      <div class="border-top border-secondary border-opacity-10 pt-3">
        <a href="/" class="sidebar-link mb-2">
          <i class="bi bi-house-door-fill"></i> <span>Home Portal</span>
        </a>
        <button onclick="performLogout()" class="sidebar-link w-100 border-0 bg-transparent text-start text-danger">
          <i class="bi bi-box-arrow-left"></i> <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
        <div>
          <h2 class="text-white fw-bold">Feedback Management</h2>
          <p class="text-secondary">Moderate rating reports and review student commentary.</p>
        </div>
      </div>

      <div class="glass-card p-4">
        <div class="table-responsive">
          <table class="table custom-table mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Event</th>
                <th>Student</th>
                <th>Rating</th>
                <th>Comments</th>
                <th>Submitted On</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="feedback-table-body">
              <tr>
                <td colspan="7" class="text-center py-4">Loading feedback records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadFeedback();
    });

    async function loadFeedback() {
      try {
        const response = await apiFetch('/api/feedback');
        const result = await response.json();
        
        if (result.success && result.data) {
          const tbody = document.getElementById('feedback-table-body');
          const feedback = result.data;
          
          if (feedback.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="7" class="text-center py-4 text-muted">No feedback records submitted.</td>
              </tr>
            `;
            return;
          }

          tbody.innerHTML = '';
          feedback.forEach(fb => {
            let starsHTML = '';
            for (let i = 1; i <= 5; i++) {
              starsHTML += i <= fb.rating ? '<i class="bi bi-star-fill text-warning"></i>' : '<i class="bi bi-star text-muted"></i>';
            }

            const eventName = fb.event ? fb.event.eventName : 'N/A';
            const studentName = fb.student ? fb.student.fullName : 'Unknown';

            tbody.innerHTML += `
              <tr>
                <td class="fw-semibold text-white">${fb.feedbackId}</td>
                <td class="text-white fw-medium">${eventName}</td>
                <td>${studentName}</td>
                <td><span class="d-flex gap-1">${starsHTML}</span></td>
                <td class="text-secondary text-truncate" style="max-width: 250px;" title="${fb.comment}">${fb.comment}</td>
                <td>${formatDate(fb.createdAt)}</td>
                <td>
                  <button onclick="deleteFeedback('${fb.feedbackId}')" class="btn btn-outline-danger btn-sm py-1 px-2"><i class="bi bi-trash"></i> Moderation delete</button>
                </td>
              </tr>
            `;
          });
        }
      } catch (error) {
        console.error('Error fetching feedback:', error);
      }
    }

    async function deleteFeedback(fbId) {
      if (!confirm(`Are you sure you want to delete feedback ${fbId}? This action cannot be undone.`)) return;

      showToast('Deleting review...', 'info');
      try {
        const response = await apiFetch(`/api/feedback/${fbId}`, {
          method: 'DELETE'
        });
        const result = await response.json();

        if (result.success) {
          showToast('Review removed successfully', 'success');
          await loadFeedback();
        } else {
          showToast(result.message || 'Deletion failed', 'error');
        }
      } catch (error) {
        console.error('Delete feedback error:', error);
      }
    }
  </script>
</body>
</html>

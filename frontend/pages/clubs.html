<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Clubs – CampusConnect</title>
  <meta name="description" content="Explore and follow college clubs. Join technical, cultural, sports, arts, and media clubs on CampusConnect.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <style>
    .clubs-hero { padding: 120px 0 60px; background: linear-gradient(180deg, rgba(168,85,247,0.06) 0%, transparent 100%); }
    .club-full-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition-base);
      height: 100%;
    }
    .club-full-card:hover { transform: translateY(-5px); border-color: var(--border-accent); box-shadow: var(--shadow-glow); }
    .club-banner { height: 110px; display: flex; align-items: flex-end; padding: 16px; position: relative; }
    .club-logo {
      width: 70px; height: 70px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; border: 3px solid rgba(255,255,255,0.1);
      position: absolute; bottom: -35px; left: 20px;
      background: var(--bg-tertiary); box-shadow: var(--shadow-md);
    }
    .club-body { padding: 50px 20px 22px; }
    .club-stat { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 0.82rem; }
    .follow-btn { transition: all 0.2s ease; }
    .follow-btn.following { background: rgba(16,185,129,0.1) !important; border-color: rgba(16,185,129,0.3) !important; color: #34d399 !important; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <span class="text-gradient">⬡</span> Campus<span class="text-gradient">Connect</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 align-items-center gap-1">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/events">Events</a></li>
          <li class="nav-item"><a class="nav-link active" href="/clubs">Clubs</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
        <ul class="navbar-nav align-items-center gap-2" id="auth-nav-options"></ul>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <section class="clubs-hero">
    <div class="container">
      <div class="text-center">
        <div class="section-badge mx-auto"><i class="bi bi-people-fill"></i> College Clubs</div>
        <h1 class="section-title display-4 mb-3">Join Our <span class="text-gradient">Vibrant</span> Clubs</h1>
        <p class="text-secondary fs-5 mx-auto mb-5" style="max-width:540px;">Connect with like-minded students. Follow clubs to stay updated on their events, announcements, and activities.</p>

        <!-- Category filter pills -->
        <div class="d-flex justify-content-center flex-wrap gap-2">
          <span class="cat-filter-pill active" onclick="filterClubs('All', this)">All Clubs</span>
          <span class="cat-filter-pill" onclick="filterClubs('Technical', this)">Technical</span>
          <span class="cat-filter-pill" onclick="filterClubs('Cultural', this)">Cultural</span>
          <span class="cat-filter-pill" onclick="filterClubs('Sports', this)">Sports</span>
          <span class="cat-filter-pill" onclick="filterClubs('Arts', this)">Arts</span>
          <span class="cat-filter-pill" onclick="filterClubs('Media', this)">Media</span>
          <span class="cat-filter-pill" onclick="filterClubs('Research', this)">Research</span>
        </div>
      </div>
    </div>
  </section>

  <!-- CLUBS GRID -->
  <section style="padding: 40px 0 100px;">
    <div class="container">
      <div class="row g-4" id="clubs-grid">
        <!-- Populated by JS -->
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    const clubsData = [
      { id: 'C001', name: 'CodeCraft', category: 'Technical', icon: '💻', members: 120, events: 8, banner: 'banner-technical', desc: 'The premier technical club for coding, competitive programming, and software development enthusiasts.', founded: '2018' },
      { id: 'C002', name: 'Rhythmix', category: 'Cultural', icon: '🎵', members: 85, events: 5, banner: 'banner-cultural', desc: 'Celebrating music, dance, and cultural heritage through annual performances and inter-college festivals.', founded: '2016' },
      { id: 'C003', name: 'SportZone', category: 'Sports', icon: '🏆', members: 200, events: 12, banner: 'banner-sports', desc: 'Organizing cricket, football, basketball, chess, and more. Fostering sportsmanship and healthy competition.', founded: '2015' },
      { id: 'C004', name: 'ArtVault', category: 'Arts', icon: '🎨', members: 60, events: 4, banner: 'banner-workshop', desc: 'A creative space for painters, sculptors, photographers, and digital artists to collaborate and showcase.', founded: '2019' },
      { id: 'C005', name: 'FrameCraft', category: 'Media', icon: '🎬', members: 45, events: 3, banner: 'banner-career', desc: 'Photography, videography, and digital media production club. Covers all campus events professionally.', founded: '2020' },
      { id: 'C006', name: 'InnovateLab', category: 'Research', icon: '🚀', members: 90, events: 6, banner: 'banner-seminar', desc: 'Research & Development club working on IoT, AI, robotics, and applied engineering projects.', founded: '2017' },
      { id: 'C007', name: 'HackNation', category: 'Technical', icon: '⚡', members: 150, events: 10, banner: 'banner-hackathon', desc: 'Dedicated hackathon club. Trains teams for national competitions and organizes internal 24-hour sprints.', founded: '2019' },
      { id: 'C008', name: 'GreenCampus', category: 'Research', icon: '🌿', members: 70, events: 5, banner: 'banner-success', desc: 'Environmental sustainability club focused on eco-drives, tree plantations, and green innovation projects.', founded: '2021' },
      { id: 'C009', name: 'DebateSphere', category: 'Cultural', icon: '🎤', members: 55, events: 7, banner: 'banner-competition', desc: 'Developing critical thinking and public speaking through MUNs, debates, elocution, and JAM sessions.', founded: '2018' },
      { id: 'C010', name: 'CareerHub', category: 'Research', icon: '💼', members: 180, events: 9, banner: 'banner-career', desc: 'Resume workshops, mock interviews, placement prep, and industry expert sessions to launch your career.', founded: '2016' },
      { id: 'C011', name: 'CyberSec', category: 'Technical', icon: '🔐', members: 65, events: 4, banner: 'banner-technical', desc: 'Ethical hacking, CTFs, network security, and digital safety awareness programs on campus.', founded: '2022' },
      { id: 'C012', name: 'LitCircle', category: 'Arts', icon: '📚', members: 40, events: 3, banner: 'banner-seminar', desc: 'A reading and writing community hosting poetry slams, book reviews, short story competitions, and creative writing workshops.', founded: '2020' },
    ];

    const bannerStyles = {
      'banner-technical':   'linear-gradient(135deg, rgba(99,102,241,0.5), rgba(67,56,202,0.8))',
      'banner-hackathon':   'linear-gradient(135deg, rgba(168,85,247,0.5), rgba(109,40,217,0.8))',
      'banner-workshop':    'linear-gradient(135deg, rgba(16,185,129,0.5), rgba(5,150,105,0.8))',
      'banner-cultural':    'linear-gradient(135deg, rgba(249,115,22,0.5), rgba(194,65,12,0.8))',
      'banner-sports':      'linear-gradient(135deg, rgba(245,158,11,0.5), rgba(180,83,9,0.8))',
      'banner-seminar':     'linear-gradient(135deg, rgba(6,182,212,0.5), rgba(3,105,161,0.8))',
      'banner-competition': 'linear-gradient(135deg, rgba(239,68,68,0.5), rgba(185,28,28,0.8))',
      'banner-career':      'linear-gradient(135deg, rgba(236,72,153,0.5), rgba(157,23,77,0.8))',
      'banner-success':     'linear-gradient(135deg, rgba(16,185,129,0.5), rgba(6,182,212,0.8))',
    };

    const followed = new Set(JSON.parse(localStorage.getItem('cc_followed_clubs') || '[]'));

    function saveFollowed() {
      localStorage.setItem('cc_followed_clubs', JSON.stringify([...followed]));
    }

    function toggleFollow(id, btn) {
      if (followed.has(id)) {
        followed.delete(id);
        btn.classList.remove('following');
        btn.innerHTML = '<i class="bi bi-heart me-1"></i>Follow';
        showToast('Unfollowed club.', 'info');
      } else {
        followed.add(id);
        btn.classList.add('following');
        btn.innerHTML = '<i class="bi bi-heart-fill me-1"></i>Following';
        showToast('You\'re now following this club! 🎉', 'success');
      }
      saveFollowed();
    }

    function filterClubs(cat, el) {
      document.querySelectorAll('.cat-filter-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderClubs(cat === 'All' ? clubsData : clubsData.filter(c => c.category === cat));
    }

    function renderClubs(clubs) {
      const grid = document.getElementById('clubs-grid');
      grid.innerHTML = '';
      clubs.forEach(club => {
        const isFollowing = followed.has(club.id);
        const bgStyle = bannerStyles[club.banner] || bannerStyles['banner-technical'];
        grid.innerHTML += `
          <div class="col-sm-6 col-md-4 col-xl-3">
            <div class="club-full-card">
              <div class="club-banner" style="background:${bgStyle};">
                <div class="club-logo">${club.icon}</div>
              </div>
              <div class="club-body">
                <h5 class="text-white fw-bold mb-1">${club.name}</h5>
                <div class="d-flex gap-3 mb-3">
                  <span class="club-stat"><i class="bi bi-people-fill"></i>${club.members} members</span>
                  <span class="club-stat"><i class="bi bi-calendar-event"></i>${club.events} events</span>
                </div>
                <p class="text-secondary small mb-3 line-clamp-3">${club.desc}</p>
                <div class="d-flex gap-2">
                  <button id="follow-${club.id}" onclick="toggleFollow('${club.id}', this)"
                    class="btn btn-sm btn-outline-premium flex-grow-1 follow-btn ${isFollowing ? 'following' : ''}">
                    ${isFollowing ? '<i class="bi bi-heart-fill me-1"></i>Following' : '<i class="bi bi-heart me-1"></i>Follow'}
                  </button>
                  <a href="/events" class="btn btn-sm btn-premium">Events</a>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    document.addEventListener('DOMContentLoaded', () => renderClubs(clubsData));
  </script>
</body>
</html>

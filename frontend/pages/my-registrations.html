<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Registrations - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <i class="bi bi-rocket-takeoff-fill text-gradient me-2"></i>Campus<span class="text-gradient">Connect</span>
      </a>
    </div>
  </nav>

  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-nav">
        <a href="/student/dashboard" class="sidebar-link">
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>
        <a href="/student/profile" class="sidebar-link">
          <i class="bi bi-person-bounding-box"></i> <span>My Profile</span>
        </a>
        <a href="/student/my-registrations" class="sidebar-link active">
          <i class="bi bi-journal-bookmark-fill"></i> <span>My Registrations</span>
        </a>
        <a href="/student/feedback" class="sidebar-link">
          <i class="bi bi-chat-heart-fill"></i> <span>Submit Feedback</span>
        </a>
        <a href="/student/settings" class="sidebar-link">
          <i class="bi bi-gear-fill"></i> <span>Settings</span>
        </a>
      </div>
      <div class="border-top border-secondary border-opacity-10 pt-3">
        <a href="/" class="sidebar-link mb-2">
          <i class="bi bi-house-door-fill"></i> <span>Home Portal</span>
        </a>
        <button onclick="performLogout()" class="sidebar-link w-100 border-0 bg-transparent text-start text-danger">
          <i class="bi bi-box-arrow-left"></i> <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
        <div>
          <h2 class="text-white fw-bold">My Registrations</h2>
          <p class="text-secondary">Track your registration statuses, check details, or cancel seats.</p>
        </div>
        <div>
          <a href="/events" class="btn btn-premium"><i class="bi bi-calendar-event me-2"></i>Register for More</a>
        </div>
      </div>

      <div class="glass-card p-4">
        <div class="table-responsive">
          <table class="table custom-table mb-0">
            <thead>
              <tr>
                <th>Reg ID</th>
                <th>Event Name</th>
                <th>Date & Time</th>
                <th>Venue</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="registrations-table-body">
              <tr>
                <td colspan="6" class="text-center py-4">Loading registrations...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await loadRegistrations();
    });

    async function loadRegistrations() {
      const user = getCurrentUser();
      if (!user) return;

      try {
        const response = await apiFetch(`/api/registrations/student/${user.studentId || user.id}`);
        const result = await response.json();
        
        if (result.success && result.data) {
          const tbody = document.getElementById('registrations-table-body');
          const regs = result.data;

          if (regs.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" class="text-center py-5 text-muted">
                  <i class="bi bi-calendar-x fs-2"></i>
                  <p class="mt-2 mb-0">You haven't registered for any events yet.</p>
                </td>
              </tr>
            `;
            return;
          }

          // Sort registrations: Active registered ones first, then date descending
          regs.sort((a, b) => {
            if (a.status === 'Registered' && b.status !== 'Registered') return -1;
            if (a.status !== 'Registered' && b.status === 'Registered') return 1;
            return new Date(b.registeredAt) - new Date(a.registeredAt);
          });

          tbody.innerHTML = '';
          regs.forEach(reg => {
            let statusClass = 'status-open';
            if (reg.status === 'Cancelled') statusClass = 'status-cancelled';
            if (reg.status === 'Attended') statusClass = 'status-completed';
            if (reg.status === 'Waitlisted') statusClass = 'status-closed';

            let actionBtn = '';
            if (reg.status === 'Registered') {
              actionBtn = `<button onclick="cancelReg('${reg.registrationId}')" class="btn btn-outline-danger btn-sm"><i class="bi bi-x-circle me-1"></i>Cancel</button>`;
            } else if (reg.status === 'Attended') {
              actionBtn = `<a href="/student/feedback?eventId=${reg.eventId}" class="btn btn-outline-success btn-sm"><i class="bi bi-chat-quote me-1"></i>Feedback</a>`;
            } else {
              actionBtn = `<span class="text-muted small">None</span>`;
            }

            const eventName = reg.event ? reg.event.eventName : 'Deleted Event';
            const eventDate = reg.event ? `${formatDate(reg.event.date)} at ${formatTime(reg.event.startTime)}` : 'N/A';
            const venue = reg.event ? reg.event.venue : 'N/A';

            tbody.innerHTML += `
              <tr>
                <td class="fw-semibold text-white">${reg.registrationId}</td>
                <td>
                  <a href="/event/${reg.eventId}" class="text-white text-decoration-none fw-semibold">${eventName}</a>
                </td>
                <td>${eventDate}</td>
                <td>${venue}</td>
                <td><span class="badge badge-status ${statusClass}">${reg.status}</span></td>
                <td>${actionBtn}</td>
              </tr>
            `;
          });
        }
      } catch (error) {
        console.error('Error fetching registrations:', error);
      }
    }

    async function cancelReg(regId) {
      if (!confirm('Are you sure you want to cancel this registration? You will lose your slot.')) return;
      
      showToast('Processing cancellation...', 'info');
      try {
        const response = await apiFetch(`/api/registrations/${regId}`, {
          method: 'DELETE'
        });
        const result = await response.json();
        
        if (result.success) {
          showToast('Registration cancelled successfully', 'success');
          await loadRegistrations();
        } else {
          showToast(result.message || 'Failed to cancel registration', 'error');
        }
      } catch (error) {
        console.error('Error cancelling registration:', error);
      }
    }
  </script>
</body>
</html>

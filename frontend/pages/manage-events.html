<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Events - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <i class="bi bi-rocket-takeoff-fill text-gradient me-2"></i>Campus<span class="text-gradient">Connect</span>
      </a>
    </div>
  </nav>

  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-link">
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>
        <a href="/admin/manage-events" class="sidebar-link active">
          <i class="bi bi-calendar-event-fill"></i> <span>Manage Events</span>
        </a>
        <a href="/admin/manage-students" class="sidebar-link">
          <i class="bi bi-people-fill"></i> <span>Manage Students</span>
        </a>
        <a href="/admin/manage-registrations" class="sidebar-link">
          <i class="bi bi-ticket-perforated-fill"></i> <span>Registrations</span>
        </a>
        <a href="/admin/analytics" class="sidebar-link">
          <i class="bi bi-graph-up-arrow"></i> <span>Event Analytics</span>
        </a>
        <a href="/admin/manage-feedback" class="sidebar-link">
          <i class="bi bi-chat-left-text-fill"></i> <span>Feedback Mgmt</span>
        </a>
      </div>
      <div class="border-top border-secondary border-opacity-10 pt-3">
        <a href="/" class="sidebar-link mb-2">
          <i class="bi bi-house-door-fill"></i> <span>Home Portal</span>
        </a>
        <button onclick="performLogout()" class="sidebar-link w-100 border-0 bg-transparent text-start text-danger">
          <i class="bi bi-box-arrow-left"></i> <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
        <div>
          <h2 class="text-white fw-bold">Manage Events</h2>
          <p class="text-secondary">Create, update, or remove campus activities.</p>
        </div>
        <button class="btn btn-premium" data-bs-toggle="modal" data-bs-target="#addEventModal">
          <i class="bi bi-plus-circle me-1"></i> Add New Event
        </button>
      </div>

      <div class="glass-card p-4">
        <div class="table-responsive">
          <table class="table custom-table mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Event Name</th>
                <th>Category</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Capacity</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="events-table-body">
              <tr>
                <td colspan="8" class="text-center py-4">Loading events inventory...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ADD EVENT MODAL -->
  <div class="modal fade" id="addEventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content modal-glass">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-white"><i class="bi bi-plus-circle-fill text-gradient me-2"></i>Create Event</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="add-event-form" onsubmit="handleAddEvent(event)">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="add-eventName" class="form-label text-secondary small">Event Name</label>
                <input type="text" class="form-control form-glass text-white" id="add-eventName" required>
              </div>
              <div class="col-md-6">
                <label for="add-category" class="form-label text-secondary small">Category</label>
                <select class="form-select form-glass text-white" id="add-category" required>
                  <option value="" disabled selected>Select category</option>
                  <option value="Technical">Technical</option>
                  <option value="Cultural">Cultural</option>
                  <option value="Sports">Sports</option>
                  <option value="Workshop">Workshop</option>
                  <option value="Seminar">Seminar</option>
                  <option value="Hackathon">Hackathon</option>
                  <option value="Competition">Competition</option>
                  <option value="Fest">Fest</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="add-organizer" class="form-label text-secondary small">Organizer</label>
                <input type="text" class="form-control form-glass text-white" id="add-organizer" required>
              </div>
              <div class="col-md-6">
                <label for="add-venue" class="form-label text-secondary small">Venue</label>
                <input type="text" class="form-control form-glass text-white" id="add-venue" required>
              </div>

              <div class="col-md-4">
                <label for="add-date" class="form-label text-secondary small">Event Date</label>
                <input type="date" class="form-control form-glass text-white" id="add-date" required>
              </div>
              <div class="col-md-4">
                <label for="add-startTime" class="form-label text-secondary small">Start Time</label>
                <input type="time" class="form-control form-glass text-white" id="add-startTime" required>
              </div>
              <div class="col-md-4">
                <label for="add-endTime" class="form-label text-secondary small">End Time</label>
                <input type="time" class="form-control form-glass text-white" id="add-endTime" required>
              </div>

              <div class="col-md-6">
                <label for="add-maxCapacity" class="form-label text-secondary small">Max Capacity</label>
                <input type="number" class="form-control form-glass text-white" id="add-maxCapacity" required min="1">
              </div>
              <div class="col-md-6">
                <label for="add-deadline" class="form-label text-secondary small">Registration Deadline</label>
                <input type="date" class="form-control form-glass text-white" id="add-deadline" required>
              </div>

              <div class="col-12">
                <label for="add-description" class="form-label text-secondary small">Description</label>
                <textarea class="form-control form-glass text-white" id="add-description" rows="3"></textarea>
              </div>

              <div class="col-md-6">
                <label for="add-eligibility" class="form-label text-secondary small">Eligibility</label>
                <input type="text" class="form-control form-glass text-white" id="add-eligibility" placeholder="e.g. Open to all branches">
              </div>
              <div class="col-md-6">
                <label for="add-image" class="form-label text-secondary small">Event Image Path</label>
                <input type="text" class="form-control form-glass text-white" id="add-image" value="/images/default-event.jpg">
              </div>

              <div class="col-12">
                <label for="add-rules" class="form-label text-secondary small">Rules & Regulations</label>
                <textarea class="form-control form-glass text-white" id="add-rules" rows="3" placeholder="Enter each rule on a new line..."></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-premium" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-premium" id="add-submit-btn">Save Event</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- EDIT EVENT MODAL -->
  <div class="modal fade" id="editEventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content modal-glass">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-white"><i class="bi bi-pencil-square text-gradient me-2"></i>Modify Event</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="edit-event-form" onsubmit="handleEditEvent(event)">
          <input type="hidden" id="edit-eventId">
          <div class="modal-body">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="edit-eventName" class="form-label text-secondary small">Event Name</label>
                <input type="text" class="form-control form-glass text-white" id="edit-eventName" required>
              </div>
              <div class="col-md-6">
                <label for="edit-category" class="form-label text-secondary small">Category</label>
                <select class="form-select form-glass text-white" id="edit-category" required>
                  <option value="Technical">Technical</option>
                  <option value="Cultural">Cultural</option>
                  <option value="Sports">Sports</option>
                  <option value="Workshop">Workshop</option>
                  <option value="Seminar">Seminar</option>
                  <option value="Hackathon">Hackathon</option>
                  <option value="Competition">Competition</option>
                  <option value="Fest">Fest</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="col-md-6">
                <label for="edit-organizer" class="form-label text-secondary small">Organizer</label>
                <input type="text" class="form-control form-glass text-white" id="edit-organizer" required>
              </div>
              <div class="col-md-6">
                <label for="edit-venue" class="form-label text-secondary small">Venue</label>
                <input type="text" class="form-control form-glass text-white" id="edit-venue" required>
              </div>

              <div class="col-md-4">
                <label for="edit-date" class="form-label text-secondary small">Event Date</label>
                <input type="date" class="form-control form-glass text-white" id="edit-date" required>
              </div>
              <div class="col-md-4">
                <label for="edit-startTime" class="form-label text-secondary small">Start Time</label>
                <input type="time" class="form-control form-glass text-white" id="edit-startTime" required>
              </div>
              <div class="col-md-4">
                <label for="edit-endTime" class="form-label text-secondary small">End Time</label>
                <input type="time" class="form-control form-glass text-white" id="edit-endTime" required>
              </div>

              <div class="col-md-4">
                <label for="edit-maxCapacity" class="form-label text-secondary small">Max Capacity</label>
                <input type="number" class="form-control form-glass text-white" id="edit-maxCapacity" required min="1">
              </div>
              <div class="col-md-4">
                <label for="edit-deadline" class="form-label text-secondary small">Registration Deadline</label>
                <input type="date" class="form-control form-glass text-white" id="edit-deadline" required>
              </div>
              <div class="col-md-4">
                <label for="edit-status" class="form-label text-secondary small">Event Status</label>
                <select class="form-select form-glass text-white" id="edit-status" required>
                  <option value="Upcoming">Upcoming</option>
                  <option value="Registration Open">Registration Open</option>
                  <option value="Registration Closed">Registration Closed</option>
                  <option value="Completed">Completed</option>
                  <option value="Cancelled">Cancelled</option>
                </select>
              </div>

              <div class="col-12">
                <label for="edit-description" class="form-label text-secondary small">Description</label>
                <textarea class="form-control form-glass text-white" id="edit-description" rows="3"></textarea>
              </div>

              <div class="col-md-6">
                <label for="edit-eligibility" class="form-label text-secondary small">Eligibility</label>
                <input type="text" class="form-control form-glass text-white" id="edit-eligibility">
              </div>
              <div class="col-md-6">
                <label for="edit-image" class="form-label text-secondary small">Event Image Path</label>
                <input type="text" class="form-control form-glass text-white" id="edit-image">
              </div>

              <div class="col-12">
                <label for="edit-rules" class="form-label text-secondary small">Rules & Regulations</label>
                <textarea class="form-control form-glass text-white" id="edit-rules" rows="3"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-premium" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-premium" id="edit-submit-btn">Update Event</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let eventsList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadEvents();
    });

    async function loadEvents() {
      try {
        const response = await apiFetch('/api/events');
        const result = await response.json();
        
        if (result.success && result.data) {
          eventsList = result.data;
          const tbody = document.getElementById('events-table-body');
          
          if (eventsList.length === 0) {
            tbody.innerHTML = `
              <tr>
                <td colspan="8" class="text-center py-4 text-muted">No events configured. Click Add New Event.</td>
              </tr>
            `;
            return;
          }

          tbody.innerHTML = '';
          eventsList.forEach(event => {
            let badgeClass = 'status-upcoming';
            if (event.status === 'Registration Open') badgeClass = 'status-open';
            if (event.status === 'Registration Closed') badgeClass = 'status-closed';
            if (event.status === 'Completed') badgeClass = 'status-completed';
            if (event.status === 'Cancelled') badgeClass = 'status-cancelled';

            tbody.innerHTML += `
              <tr>
                <td class="fw-semibold text-white">${event.eventId}</td>
                <td><a href="/event/${event.eventId}" class="text-white text-decoration-none fw-semibold">${event.eventName}</a></td>
                <td><span class="text-gradient fw-medium text-uppercase" style="font-size: 0.75rem;">${event.category}</span></td>
                <td>${formatDate(event.date)}</td>
                <td>${event.venue}</td>
                <td>${event.currentRegistrations} / ${event.maxCapacity}</td>
                <td><span class="badge badge-status ${badgeClass}">${event.status}</span></td>
                <td>
                  <button onclick="openEditModal('${event.eventId}')" class="btn btn-outline-premium btn-sm py-1 px-2 me-1"><i class="bi bi-pencil"></i></button>
                  <button onclick="deleteEvent('${event.eventId}')" class="btn btn-outline-danger btn-sm py-1 px-2"><i class="bi bi-trash"></i></button>
                </td>
              </tr>
            `;
          });
        }
      } catch (error) {
        console.error('Error fetching events:', error);
      }
    }

    async function handleAddEvent(event) {
      event.preventDefault();
      
      const submitBtn = document.getElementById('add-submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Saving...`;

      const newEvent = {
        eventName: document.getElementById('add-eventName').value.trim(),
        category: document.getElementById('add-category').value,
        organizer: document.getElementById('add-organizer').value.trim(),
        venue: document.getElementById('add-venue').value.trim(),
        date: document.getElementById('add-date').value,
        startTime: document.getElementById('add-startTime').value,
        endTime: document.getElementById('add-endTime').value,
        maxCapacity: document.getElementById('add-maxCapacity').value,
        registrationDeadline: document.getElementById('add-deadline').value,
        description: document.getElementById('add-description').value.trim(),
        eligibility: document.getElementById('add-eligibility').value.trim() || 'Open to all',
        image: document.getElementById('add-image').value.trim(),
        rules: document.getElementById('add-rules').value.trim()
      };

      try {
        const response = await apiFetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newEvent)
        });
        const result = await response.json();

        if (result.success) {
          showToast('Event created successfully!', 'success');
          document.getElementById('add-event-form').reset();
          
          // Dismiss modal
          const modal = bootstrap.Modal.getInstance(document.getElementById('addEventModal'));
          modal.hide();
          
          await loadEvents();
        } else {
          showToast(result.message || 'Creation failed', 'error');
        }
      } catch (error) {
        console.error('Add event error:', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `Save Event`;
      }
    }

    function openEditModal(eventId) {
      const event = eventsList.find(e => e.eventId === eventId);
      if (!event) return;

      document.getElementById('edit-eventId').value = event.eventId;
      document.getElementById('edit-eventName').value = event.eventName;
      document.getElementById('edit-category').value = event.category;
      document.getElementById('edit-organizer').value = event.organizer;
      document.getElementById('edit-venue').value = event.venue;
      document.getElementById('edit-date').value = event.date;
      document.getElementById('edit-startTime').value = event.startTime;
      document.getElementById('edit-endTime').value = event.endTime;
      document.getElementById('edit-maxCapacity').value = event.maxCapacity;
      document.getElementById('edit-deadline').value = event.registrationDeadline;
      document.getElementById('edit-status').value = event.status;
      document.getElementById('edit-description').value = event.description;
      document.getElementById('edit-eligibility').value = event.eligibility;
      document.getElementById('edit-image').value = event.image;
      document.getElementById('edit-rules').value = event.rules;

      const modal = new bootstrap.Modal(document.getElementById('editEventModal'));
      modal.show();
    }

    async function handleEditEvent(event) {
      event.preventDefault();

      const eventId = document.getElementById('edit-eventId').value;
      const submitBtn = document.getElementById('edit-submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Updating...`;

      const updatedEvent = {
        eventName: document.getElementById('edit-eventName').value.trim(),
        category: document.getElementById('edit-category').value,
        organizer: document.getElementById('edit-organizer').value.trim(),
        venue: document.getElementById('edit-venue').value.trim(),
        date: document.getElementById('edit-date').value,
        startTime: document.getElementById('edit-startTime').value,
        endTime: document.getElementById('edit-endTime').value,
        maxCapacity: document.getElementById('edit-maxCapacity').value,
        registrationDeadline: document.getElementById('edit-deadline').value,
        status: document.getElementById('edit-status').value,
        description: document.getElementById('edit-description').value.trim(),
        eligibility: document.getElementById('edit-eligibility').value.trim() || 'Open to all',
        image: document.getElementById('edit-image').value.trim(),
        rules: document.getElementById('edit-rules').value.trim()
      };

      try {
        const response = await apiFetch(`/api/events/${eventId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedEvent)
        });
        const result = await response.json();

        if (result.success) {
          showToast('Event updated successfully!', 'success');
          
          // Dismiss modal
          const modal = bootstrap.Modal.getInstance(document.getElementById('editEventModal'));
          modal.hide();
          
          await loadEvents();
        } else {
          showToast(result.message || 'Update failed', 'error');
        }
      } catch (error) {
        console.error('Edit event error:', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `Update Event`;
      }
    }

    async function deleteEvent(eventId) {
      if (!confirm(`Warning: Are you sure you want to delete Event ${eventId}? This will permanently wipe all registrations and ratings associated with it.`)) return;

      showToast('Deleting event...', 'info');
      try {
        const response = await apiFetch(`/api/events/${eventId}`, {
          method: 'DELETE'
        });
        const result = await response.json();

        if (result.success) {
          showToast('Event deleted successfully', 'success');
          await loadEvents();
        } else {
          showToast(result.message || 'Deletion failed', 'error');
        }
      } catch (error) {
        console.error('Delete event error:', error);
      }
    }
  </script>
</body>
</html>

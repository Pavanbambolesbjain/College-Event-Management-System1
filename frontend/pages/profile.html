<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <i class="bi bi-rocket-takeoff-fill text-gradient me-2"></i>Campus<span class="text-gradient">Connect</span>
      </a>
    </div>
  </nav>

  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-nav">
        <a href="/student/dashboard" class="sidebar-link">
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>
        <a href="/student/profile" class="sidebar-link active">
          <i class="bi bi-person-bounding-box"></i> <span>My Profile</span>
        </a>
        <a href="/student/my-registrations" class="sidebar-link">
          <i class="bi bi-journal-bookmark-fill"></i> <span>My Registrations</span>
        </a>
        <a href="/student/feedback" class="sidebar-link">
          <i class="bi bi-chat-heart-fill"></i> <span>Submit Feedback</span>
        </a>
        <a href="/student/settings" class="sidebar-link">
          <i class="bi bi-gear-fill"></i> <span>Settings</span>
        </a>
      </div>
      <div class="border-top border-secondary border-opacity-10 pt-3">
        <a href="/" class="sidebar-link mb-2">
          <i class="bi bi-house-door-fill"></i> <span>Home Portal</span>
        </a>
        <button onclick="performLogout()" class="sidebar-link w-100 border-0 bg-transparent text-start text-danger">
          <i class="bi bi-box-arrow-left"></i> <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Content -->
    <main class="main-content">
      <div class="mb-5">
        <h2 class="text-white fw-bold">My Profile</h2>
        <p class="text-secondary">View or update your account information.</p>
      </div>

      <div class="row g-4">
        <!-- Edit Profile Panel -->
        <div class="col-lg-8">
          <div class="glass-card p-4">
            <h4 class="text-white fw-bold mb-4">Profile Details</h4>
            
            <form id="profile-form" onsubmit="handleUpdateProfile(event)">
              <div class="row g-3 mb-3">
                <!-- Student ID -->
                <div class="col-md-6">
                  <label class="form-label text-secondary small">Student ID (Read-only)</label>
                  <input type="text" class="form-control form-glass text-white" id="studentId" disabled>
                </div>
                <!-- Registration Date -->
                <div class="col-md-6">
                  <label class="form-label text-secondary small">Joined On</label>
                  <input type="text" class="form-control form-glass text-white" id="joinedDate" disabled>
                </div>
              </div>

              <!-- Full Name -->
              <div class="mb-3">
                <label for="fullName" class="form-label text-secondary small">Full Name</label>
                <input type="text" class="form-control form-glass text-white" id="fullName" required>
              </div>

              <div class="row g-3 mb-3">
                <!-- Email -->
                <div class="col-md-6">
                  <label for="email" class="form-label text-secondary small">Email Address</label>
                  <input type="email" class="form-control form-glass text-white" id="email" required>
                </div>
                <!-- Mobile -->
                <div class="col-md-6">
                  <label for="mobile" class="form-label text-secondary small">Mobile Number</label>
                  <input type="tel" class="form-control form-glass text-white" id="mobile" required pattern="[0-9]{10}">
                </div>
              </div>

              <!-- College -->
              <div class="mb-3">
                <label for="college" class="form-label text-secondary small">College Name</label>
                <input type="text" class="form-control form-glass text-white" id="college" required>
              </div>

              <div class="row g-3 mb-4">
                <!-- Course -->
                <div class="col-md-8">
                  <label for="course" class="form-label text-secondary small">Course/Department</label>
                  <select class="form-select form-glass text-white" id="course" required>
                    <option value="Computer Engineering">Computer Engineering</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Electronics & TC Engineering">Electronics & TC Engineering</option>
                    <option value="Computer Science & Design">Computer Science & Design</option>
                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                  </select>
                </div>
                <!-- Year -->
                <div class="col-md-4">
                  <label for="year" class="form-label text-secondary small">Academic Year</label>
                  <select class="form-select form-glass text-white" id="year" required>
                    <option value="1">First Year</option>
                    <option value="2">Second Year</option>
                    <option value="3">Third Year</option>
                    <option value="4">Fourth Year</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="btn btn-premium" id="save-btn">Save Changes</button>
            </form>
          </div>
        </div>

        <!-- Security / Password change info -->
        <div class="col-lg-4">
          <div class="glass-card p-4 mb-4">
            <h5 class="text-white fw-bold mb-3"><i class="bi bi-shield-fill-exclamation text-gradient me-2"></i>Account Security</h5>
            <p class="text-secondary small">To change your password or security credentials, please navigate to the settings page.</p>
            <a href="/student/settings" class="btn btn-outline-premium btn-sm w-100"><i class="bi bi-shield-lock-fill me-1"></i>Go to Settings</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let studentData = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const user = getCurrentUser();
      if (!user) return;

      try {
        const response = await apiFetch(`/api/students/${user.studentId || user.id}`);
        const result = await response.json();
        
        if (result.success && result.data) {
          studentData = result.data;
          // Populate fields
          document.getElementById('studentId').value = studentData.studentId;
          document.getElementById('joinedDate').value = formatDate(studentData.createdAt);
          document.getElementById('fullName').value = studentData.fullName;
          document.getElementById('email').value = studentData.email;
          document.getElementById('mobile').value = studentData.mobile;
          document.getElementById('college').value = studentData.college;
          document.getElementById('course').value = studentData.course;
          document.getElementById('year').value = studentData.year;
        }
      } catch (error) {
        console.error('Error fetching student profile details:', error);
      }
    });

    async function handleUpdateProfile(event) {
      event.preventDefault();
      
      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Updating...`;

      const user = getCurrentUser();
      const updatedFields = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        mobile: document.getElementById('mobile').value.trim(),
        college: document.getElementById('college').value.trim(),
        course: document.getElementById('course').value,
        year: document.getElementById('year').value
      };

      try {
        const response = await apiFetch(`/api/students/${user.studentId || user.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(updatedFields)
        });
        const result = await response.json();
        
        if (result.success && result.data) {
          showToast('Profile updated successfully!', 'success');
          // Update local storage representation
          setCurrentUser({
            ...user,
            fullName: result.data.fullName,
            email: result.data.email
          });
        } else {
          showToast(result.message || 'Profile update failed', 'error');
        }
      } catch (error) {
        console.error('Update profile error:', error);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = `Save Changes`;
      }
    }
  </script>
</body>
</html>

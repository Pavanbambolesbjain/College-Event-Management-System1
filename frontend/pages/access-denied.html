<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh; background: radial-gradient(circle, rgba(239,68,68,0.06) 0%, transparent 60%);">

  <div class="container text-center py-5">
    <div class="glass-card p-5 mx-auto" style="max-width: 500px; border-color: rgba(239, 68, 68, 0.2);">
      <div class="fs-1 text-danger mb-3"><i class="bi bi-shield-slash-fill"></i></div>
      <h3 class="text-white fw-bold mb-3">Access Denied</h3>
      <p class="text-secondary mb-4">
        You do not have the required permissions to view this resource. Please verify your account authorization.
      </p>

      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="/" class="btn btn-premium"><i class="bi bi-house-door-fill me-1"></i>Go Home</a>
        <button onclick="performLogout()" class="btn btn-outline-danger"><i class="bi bi-box-arrow-left me-1"></i>Sign in as Another User</button>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>

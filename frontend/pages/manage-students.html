<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <i class="bi bi-rocket-takeoff-fill text-gradient me-2"></i>Campus<span class="text-gradient">Connect</span>
      </a>
    </div>
  </nav>

  <div class="dashboard-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-nav">
        <a href="/admin/dashboard" class="sidebar-link">
          <i class="bi bi-speedometer2"></i> <span>Dashboard</span>
        </a>
        <a href="/admin/manage-events" class="sidebar-link">
          <i class="bi bi-calendar-event-fill"></i> <span>Manage Events</span>
        </a>
        <a href="/admin/manage-students" class="sidebar-link active">
          <i class="bi bi-people-fill"></i> <span>Manage Students</span>
        </a>
        <a href="/admin/manage-registrations" class="sidebar-link">
          <i class="bi bi-ticket-perforated-fill"></i> <span>Registrations</span>
        </a>
        <a href="/admin/analytics" class="sidebar-link">
          <i class="bi bi-graph-up-arrow"></i> <span>Event Analytics</span>
        </a>
        <a href="/admin/manage-feedback" class="sidebar-link">
          <i class="bi bi-chat-left-text-fill"></i> <span>Feedback Mgmt</span>
        </a>
      </div>
      <div class="border-top border-secondary border-opacity-10 pt-3">
        <a href="/" class="sidebar-link mb-2">
          <i class="bi bi-house-door-fill"></i> <span>Home Portal</span>
        </a>
        <button onclick="performLogout()" class="sidebar-link w-100 border-0 bg-transparent text-start text-danger">
          <i class="bi bi-box-arrow-left"></i> <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Content -->
    <main class="main-content">
      <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
        <div>
          <h2 class="text-white fw-bold">Manage Students</h2>
          <p class="text-secondary">View list of registered students or delete accounts.</p>
        </div>
        <!-- Search bar -->
        <div style="width: 280px;">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 form-glass text-secondary" style="border-radius: 10px 0 0 10px;"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control form-glass border-start-0 ps-0" id="search-students" placeholder="Search students..." onkeyup="filterStudents()" style="border-radius: 0 10px 10px 0;">
          </div>
        </div>
      </div>

      <div class="glass-card p-4">
        <div class="table-responsive">
          <table class="table custom-table mb-0">
            <thead>
              <tr>
                <th>Student ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>Course/Department</th>
                <th>Year</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="students-table-body">
              <tr>
                <td colspan="7" class="text-center py-4">Loading student directory...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    let allStudents = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await loadStudents();
    });

    async function loadStudents() {
      try {
        const response = await apiFetch('/api/students');
        const result = await response.json();
        
        if (result.success && result.data) {
          allStudents = result.data;
          renderStudents(allStudents);
        }
      } catch (error) {
        console.error('Error fetching students:', error);
      }
    }

    function renderStudents(students) {
      const tbody = document.getElementById('students-table-body');
      
      if (students.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-4 text-muted">No students found.</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = '';
      students.forEach(student => {
        tbody.innerHTML += `
          <tr>
            <td class="fw-semibold text-white">${student.studentId}</td>
            <td class="text-white fw-medium">${student.fullName}</td>
            <td>${student.email}</td>
            <td>${student.mobile}</td>
            <td><span class="text-gradient fw-medium" style="font-size: 0.85rem;">${student.course}</span></td>
            <td>Year ${student.year}</td>
            <td>
              <button onclick="deleteStudent('${student.studentId}')" class="btn btn-outline-danger btn-sm py-1 px-2"><i class="bi bi-trash"></i> Delete</button>
            </td>
          </tr>
        `;
      });
    }

    function filterStudents() {
      const query = document.getElementById('search-students').value.toLowerCase();
      const filtered = allStudents.filter(s => 
        s.fullName.toLowerCase().includes(query) ||
        s.email.toLowerCase().includes(query) ||
        s.studentId.toLowerCase().includes(query) ||
        s.course.toLowerCase().includes(query)
      );
      renderStudents(filtered);
    }

    async function deleteStudent(studentId) {
      if (!confirm(`Warning: Are you sure you want to delete student ${studentId}? This will permanently delete their profile, registrations, and submitted feedback.`)) return;

      showToast('Deleting student profile...', 'info');
      try {
        const response = await apiFetch(`/api/students/${studentId}`, {
          method: 'DELETE'
        });
        const result = await response.json();

        if (result.success) {
          showToast('Student deleted successfully', 'success');
          await loadStudents();
        } else {
          showToast(result.message || 'Deletion failed', 'error');
        }
      } catch (error) {
        console.error('Delete student error:', error);
      }
    }
  </script>
</body>
</html>

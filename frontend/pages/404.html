<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-center align-items-center" style="min-height: 100vh; background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 60%);">

  <div class="container text-center py-5">
    <div class="glass-card p-5 mx-auto" style="max-width: 500px;">
      <h1 class="display-1 fw-bold text-gradient mb-3">404</h1>
      <h3 class="text-white fw-bold mb-3">Oops! Page Not Found</h3>
      <p class="text-secondary mb-4">
        The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
      </p>
      
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="/" class="btn btn-premium"><i class="bi bi-house-door-fill me-1"></i>Go Home</a>
        <button onclick="window.history.back()" class="btn btn-outline-premium"><i class="bi bi-arrow-left me-1"></i>Go Back</button>
      </div>
    </div>
  </div>

  <div class="position-absolute bottom-0 py-3 text-center text-muted small">
    © 2026 CampusConnect. All rights reserved.
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

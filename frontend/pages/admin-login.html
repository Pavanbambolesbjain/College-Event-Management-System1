<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-between" style="min-height: 100vh;">

  <!-- Responsive Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <i class="bi bi-rocket-takeoff-fill text-gradient me-2"></i>Campus<span class="text-gradient">Connect</span>
      </a>
      <a href="/" class="btn btn-outline-premium btn-sm"><i class="bi bi-house-door-fill me-1"></i>Home</a>
    </div>
  </nav>

  <!-- Login Card container -->
  <div class="container py-5 mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5 col-xl-4 mt-5">
        <div class="glass-card p-4">
          <div class="text-center mb-4">
            <div class="fs-1 text-gradient mb-2"><i class="bi bi-shield-lock-fill"></i></div>
            <h3 class="text-white fw-bold">Admin Portal</h3>
            <p class="text-secondary small">Access system configurations and analytics</p>
          </div>

          <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label text-secondary small fw-medium">Admin Email</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 form-glass text-secondary"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control form-glass border-start-0 ps-0 text-white" id="email" required placeholder="admin@campusconnect.com">
              </div>
            </div>

            <!-- Password -->
            <div class="mb-4">
              <label for="password" class="form-label text-secondary small fw-medium">Security Password</label>
              <div class="input-group">
                <span class="input-group-text bg-transparent border-end-0 form-glass text-secondary"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control form-glass border-start-0 ps-0 text-white" id="password" required placeholder="••••••••">
              </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-premium w-100 mb-3" id="submit-btn">
              <i class="bi bi-shield-lock me-1"></i> Admin Authorize
            </button>

            <!-- Bottom Actions -->
            <div class="text-center">
              <p class="text-secondary small mb-0">Are you a student? <a href="/login" class="text-gradient fw-semibold text-decoration-none">Student Portal</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-3 mt-auto">
    <div class="container text-center text-muted small">
      © 2026 CampusConnect. All rights reserved. Built for TAE-I Engineering Evaluation.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function handleAdminLogin(event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      if (!email || !password) {
        showToast('Please fill all credentials', 'warning');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Authorizing...`;

      try {
        const response = await apiFetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          showToast('Authorization successful! Loading admin control...', 'success');
          // Save admin session details
          setCurrentUser({
            adminId: data.user.adminId,
            fullName: data.user.fullName,
            email: data.user.email,
            role: 'admin'
          });

          setTimeout(() => {
            window.location.href = '/admin/dashboard';
          }, 800);
        } else {
          showToast(data.message || 'Invalid admin credentials', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="bi bi-shield-lock me-1"></i> Admin Authorize`;
        }
      } catch (error) {
        console.error('Admin login error:', error);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="bi bi-shield-lock me-1"></i> Admin Authorize`;
      }
    }
  </script>
</body>
</html>

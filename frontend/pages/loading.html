<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading... - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center bg-gradient-dark" style="min-height: 100vh;">

  <div class="text-center">
    <div class="spinner-grow text-primary mb-3" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <h5 class="text-white fw-bold display-font">CampusConnect</h5>
    <p class="text-secondary small">Redirecting your session...</p>
  </div>

  <script>
    // Simple auto redirect back home if stuck
    setTimeout(() => {
      window.location.href = '/';
    }, 3000);
  </script>
</body>
</html>

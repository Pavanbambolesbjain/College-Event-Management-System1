<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - CampusConnect</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
</head>
<body class="d-flex flex-column justify-content-between" style="min-height: 100vh;">

  <!-- Responsive Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-nav fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold display-font text-white" href="/">
        <i class="bi bi-rocket-takeoff-fill text-gradient me-2"></i>Campus<span class="text-gradient">Connect</span>
      </a>
      <a href="/" class="btn btn-outline-premium btn-sm"><i class="bi bi-house-door-fill me-1"></i>Home</a>
    </div>
  </nav>

  <!-- Register Form container -->
  <div class="container py-5 mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6 col-xl-5 mt-4">
        <div class="glass-card p-4">
          <div class="text-center mb-4">
            <div class="fs-1 text-gradient mb-2"><i class="bi bi-person-plus-fill"></i></div>
            <h3 class="text-white fw-bold">Student Registration</h3>
            <p class="text-secondary small">Join CampusConnect to participate in activities</p>
          </div>

          <form id="student-register-form" onsubmit="handleRegister(event)">
            <!-- Full Name -->
            <div class="mb-3">
              <label for="fullName" class="form-label text-secondary small fw-medium">Full Name</label>
              <input type="text" class="form-control form-glass" id="fullName" required placeholder="Enter full name">
            </div>

            <div class="row g-3 mb-3">
              <!-- Email -->
              <div class="col-md-6">
                <label for="email" class="form-label text-secondary small fw-medium">Email Address</label>
                <input type="email" class="form-control form-glass" id="email" required placeholder="name@college.edu">
              </div>
              <!-- Mobile -->
              <div class="col-md-6">
                <label for="mobile" class="form-label text-secondary small fw-medium">Mobile Number</label>
                <input type="tel" class="form-control form-glass" id="mobile" required pattern="[0-9]{10}" placeholder="10-digit number">
              </div>
            </div>

            <!-- College / Department -->
            <div class="mb-3">
              <label for="college" class="form-label text-secondary small fw-medium">College Name</label>
              <input type="text" class="form-control form-glass" id="college" required value="Pune Institute of Computer Technology" placeholder="College name">
            </div>

            <div class="row g-3 mb-3">
              <!-- Course -->
              <div class="col-md-8">
                <label for="course" class="form-label text-secondary small fw-medium">Course/Department</label>
                <select class="form-select form-glass" id="course" required>
                  <option value="" disabled selected>Select course</option>
                  <option value="Computer Engineering">Computer Engineering</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics & TC Engineering">Electronics & TC Engineering</option>
                  <option value="Computer Science & Design">Computer Science & Design</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                </select>
              </div>
              <!-- Year -->
              <div class="col-md-4">
                <label for="year" class="form-label text-secondary small fw-medium">Year</label>
                <select class="form-select form-glass" id="year" required>
                  <option value="" disabled selected>Year</option>
                  <option value="1">First Year</option>
                  <option value="2">Second Year</option>
                  <option value="3">Third Year</option>
                  <option value="4">Fourth Year</option>
                </select>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <!-- Password -->
              <div class="col-md-6">
                <label for="password" class="form-label text-secondary small fw-medium">Password</label>
                <input type="password" class="form-control form-glass" id="password" required minlength="6" placeholder="Min 6 chars">
              </div>
              <!-- Confirm Password -->
              <div class="col-md-6">
                <label for="confirmPassword" class="form-label text-secondary small fw-medium">Confirm Password</label>
                <input type="password" class="form-control form-glass" id="confirmPassword" required minlength="6" placeholder="Re-type password">
              </div>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-premium w-100 mb-3" id="submit-btn">
              <i class="bi bi-person-check-fill me-1"></i> Register & Log In
            </button>

            <!-- Bottom Actions -->
            <div class="text-center">
              <p class="text-secondary small mb-0">Already registered? <a href="/login" class="text-gradient fw-semibold text-decoration-none">Log In</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-3 mt-auto">
    <div class="container text-center text-muted small">
      © 2026 CampusConnect. All rights reserved. Built for TAE-I Engineering Evaluation.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function handleRegister(event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const college = document.getElementById('college').value.trim();
      const course = document.getElementById('course').value;
      const year = document.getElementById('year').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submit-btn');

      // Client-side validations
      if (password !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      if (mobile.length !== 10 || isNaN(mobile)) {
        showToast('Please enter a valid 10-digit mobile number', 'warning');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Registering...`;

      try {
        const response = await apiFetch('/api/auth/student/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fullName,
            email,
            mobile,
            college,
            course,
            year,
            password
          })
        });

        const data = await response.json();

        if (data.success) {
          showToast('Registration successful!', 'success');
          // Save session locally
          setCurrentUser({
            studentId: data.user.studentId,
            fullName: data.user.fullName,
            email: data.user.email,
            role: 'student'
          });
          
          setTimeout(() => {
            window.location.href = '/student/dashboard';
          }, 800);
        } else {
          showToast(data.message || 'Registration failed', 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<i class="bi bi-person-check-fill me-1"></i> Register & Log In`;
        }
      } catch (error) {
        console.error('Registration error:', error);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="bi bi-person-check-fill me-1"></i> Register & Log In`;
      }
    }
  </script>
</body>
</html>
